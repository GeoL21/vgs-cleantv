# TuneTV: compila la APK en cada cambio y la publica en Releases como "Última versión".
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Nombrar la APK
        id: apk
        run: |
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)
          NOMBRE="TuneTV-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NOMBRE"
          echo "nombre=$NOMBRE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.nombre }}
          path: ${{ steps.apk.outputs.nombre }}

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag 2>/dev/null || true
          gh release create ultima "${{ steps.apk.outputs.nombre }}" \
            --target "$GITHUB_SHA" \
            --title "TuneTV ${{ steps.apk.outputs.version }} (compilación ${GITHUB_RUN_NUMBER})" \
            --notes "Descarga el archivo .apk de abajo e instálalo en tu teléfono Android o en la TV. Compilada automáticamente desde el último cambio."
